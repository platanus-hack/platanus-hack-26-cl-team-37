# CI/CD de ManoViva (F29, dueño P1). Spec: docs/equipo/flujo-git-ci.md §3 y §4.
#
#   verificar      tipos, lint, unitarias y build. Sin claves. Siempre.
#   e2e            Playwright contra la base compartida (= producción), uno a la vez en todo el repo.
#                  Corre solo si están los secretos de Supabase.
#   vista-previa   deploy de vista previa en Vercel por cada PR y comentario con la URL.
#   desplegar      deploy a producción al unir a main, con prueba de humo.
#                  vista-previa y desplegar corren solo si están los secretos de Vercel.
#
# Sin secretos, los jobs que los necesitan se omiten (no fallan) y el resumen de la corrida dice qué falta.
# Secretos (Settings → Secrets and variables → Actions, o `gh secret set NOMBRE`):
#   Supabase: VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY, SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY
#   Vercel:   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID (los dos últimos están en .vercel/project.json)
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  SITIO: https://manoviva-sigma.vercel.app

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Un push nuevo a la misma rama o PR cancela el verificar anterior (no toca la base).
    concurrency:
      group: verificar-${{ github.ref }}
      cancel-in-progress: true
    outputs:
      supabase: ${{ steps.secretos.outputs.supabase }}
      vercel: ${{ steps.secretos.outputs.vercel }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # el chequeo de dueños compara contra origin/main

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      - name: Tipos
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Pruebas unitarias
        run: npm test

      - name: Build
        run: npm run build

      # Informativo: no bloquea. El rol sale del prefijo de la rama (p1/, p2/, p3/).
      - name: Dueños de archivos (informativo)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          RAMA: ${{ github.head_ref }}
        run: |
          case "$RAMA" in
            p1/*) ROL=P1 ;;
            p2/*) ROL=P2 ;;
            p3/*) ROL=P3 ;;
            *) echo "Rama '$RAMA' sin prefijo p1/ p2/ p3/: se omite el chequeo de dueños."; exit 0 ;;
          esac
          node scripts/dueno.mjs --cambios --rol "$ROL" --base origin/main

      # Solo dice si existen (true/false); nunca imprime valores.
      - name: Secretos disponibles
        id: secretos
        env:
          A: ${{ secrets.VITE_SUPABASE_URL }}
          B: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          C: ${{ secrets.SUPABASE_URL }}
          D: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          E: ${{ secrets.VERCEL_TOKEN }}
          F: ${{ secrets.VERCEL_ORG_ID }}
          G: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -n "$A" ] && [ -n "$B" ] && [ -n "$C" ] && [ -n "$D" ]; then sb=true; else sb=false; fi
          if [ -n "$E" ] && [ -n "$F" ] && [ -n "$G" ]; then vc=true; else vc=false; fi
          echo "supabase=$sb" >> "$GITHUB_OUTPUT"
          echo "vercel=$vc" >> "$GITHUB_OUTPUT"
          {
            echo "### Secretos"
            echo "- Supabase (e2e): $([ $sb = true ] && echo 'listos' || echo 'faltan: e2e se omite')"
            echo "- Vercel (vista previa y deploy): $([ $vc = true ] && echo 'listos' || echo 'faltan: vista previa y deploy se omiten')"
          } >> "$GITHUB_STEP_SUMMARY"

  e2e:
    needs: verificar
    if: needs.verificar.outputs.supabase == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Base compartida: una corrida a la vez en todo el repositorio, y nunca se corta a mitad
    # (una prueba cortada puede dejar datos del paciente de prueba sin limpiar).
    concurrency:
      group: e2e-supabase
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      - name: Caché del navegador de Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Archivos de entorno desde secretos
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          umask 077
          printf 'VITE_SUPABASE_URL=%s\nVITE_SUPABASE_ANON_KEY=%s\n' "$VITE_SUPABASE_URL" "$VITE_SUPABASE_ANON_KEY" > .env.local
          printf 'SUPABASE_URL=%s\nSUPABASE_SERVICE_ROLE_KEY=%s\n' "$SUPABASE_URL" "$SUPABASE_SERVICE_ROLE_KEY" > .env.secrets

      - name: Permisos, inmutabilidad y hashes de la base
        run: npm run verify:db

      - name: e2e
        run: npx playwright test --workers=2 --retries=1

      - name: e2e sin conexión (build + preview)
        run: npm run e2e:offline

      - name: Guardar trazas si falló
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-trazas
          path: test-results/
          retention-days: 7

  vista-previa:
    needs: verificar
    if: github.event_name == 'pull_request' && needs.verificar.outputs.vercel == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: vista-previa-${{ github.ref }}
      cancel-in-progress: true
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Deploy de vista previa
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          # Si están las claves públicas de Supabase, se pasan al build para que la vista previa no dependa
          # de que el proyecto de Vercel tenga variables de "Preview".
          EXTRA=()
          if [ -n "$VITE_SUPABASE_URL" ] && [ -n "$VITE_SUPABASE_ANON_KEY" ]; then
            EXTRA=(--build-env "VITE_SUPABASE_URL=$VITE_SUPABASE_URL" --build-env "VITE_SUPABASE_ANON_KEY=$VITE_SUPABASE_ANON_KEY")
          fi
          URL=$(npx --yes vercel@latest deploy --yes --token "$VERCEL_TOKEN" "${EXTRA[@]}")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Vista previa: $URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Comentar la URL en el PR
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.deploy.outputs.url }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          MARCA='<!-- vista-previa-manoviva -->'
          CUERPO=$(printf '%s\n**Vista previa** de este PR: %s\n\nCommit `%s`. Se actualiza en cada push. Si pide entrar a Vercel, el proyecto tiene la protección de despliegues activada.' "$MARCA" "$URL" "${SHA:0:7}")
          ID=$(gh api "repos/$REPO/issues/$PR/comments" --paginate -q ".[] | select(.body | contains(\"$MARCA\")) | .id" | tail -1)
          if [ -n "$ID" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$ID" -f body="$CUERPO" > /dev/null
          else
            gh api "repos/$REPO/issues/$PR/comments" -f body="$CUERPO" > /dev/null
          fi

  desplegar:
    needs: [verificar, e2e]
    # e2e omitido (sin secretos de Supabase) no frena el deploy; e2e fallido sí.
    if: >-
      !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.verificar.result == 'success' && needs.verificar.outputs.vercel == 'true' &&
      (needs.e2e.result == 'success' || needs.e2e.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: desplegar-produccion
      cancel-in-progress: false
    environment:
      name: produccion
      url: ${{ env.SITIO }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      # Build remoto en Vercel con las variables VITE_* guardadas en el proyecto (como el deploy manual).
      - name: Deploy a producción
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          URL=$(npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN")
          echo "Deploy: $URL → $SITIO" >> "$GITHUB_STEP_SUMMARY"

      - name: Prueba de humo
        run: |
          for i in $(seq 1 10); do curl -fsS -o /dev/null "$SITIO/" && break; sleep 6; done
          curl -fsS -o /dev/null "$SITIO/"
          curl -fsS -o /dev/null "$SITIO/manifest.webmanifest"
          curl -fsS -o /dev/null "$SITIO/mediapipe/hand_landmarker.task" -r 0-0
          curl -fsSI "$SITIO/" | grep -qi '^content-security-policy:' || { echo "Falta la cabecera Content-Security-Policy"; exit 1; }
          echo "Prueba de humo OK" >> "$GITHUB_STEP_SUMMARY"
